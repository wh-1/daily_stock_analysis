          LLM_OLLAMA_API_KEY: ${{ secrets.LLM_OLLAMA_API_KEY }}
          LLM_OLLAMA_API_KEYS: ${{ secrets.LLM_OLLAMA_API_KEYS }}
          LLM_OLLAMA_MODELS: ${{ vars.LLM_OLLAMA_MODELS || secrets.LLM_OLLAMA_MODELS }}
          LLM_OLLAMA_ENABLED: ${{ vars.LLM_OLLAMA_ENABLED || secrets.LLM_OLLAMA_ENABLED }}
          LLM_OLLAMA_EXTRA_HEADERS: ${{ vars.LLM_OLLAMA_EXTRA_HEADERS || secrets.LLM_OLLAMA_EXTRA_HEADERS }}

          # ==========================================
          # 数据源
          # ==========================================
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          # —— 选股全链路统一来源优先级：新浪 > 腾讯 > Baostock > akshare > 东财 ——
          # ① 实时/基本面链路（path ②，get_realtime_quote / fundamental valuation）走 REALTIME_SOURCE_PRIORITY
          #    （named token）：akshare_sina 直连新浪、不经东财；腾讯次之；东财(efinance)垫底仅兜底。
          #    baostock / 组合 akshare 不是 realtime token，进不到这层。
          REALTIME_SOURCE_PRIORITY: ${{ vars.REALTIME_SOURCE_PRIORITY || 'akshare_sina,tencent,efinance' }}
          # ② 日K历史链优先级（benchmark 实测，海外 runner）：
          #    - DataFetcherManager 路径（path ③，个股深度分析 get_daily_data）按 *_PRIORITY 升序；
          #      baostock 实测最快(234ms/100%)→提最前(0)，tencent(2)次之，akshare(10)，东财 efinance(99)沉底兜底。
          #    - screening/daily.py 每票日K 路径走 DAILY_SOURCE（benchmark 序：baostock>sina>tencent>akshare，
          #      东财/akshare 的 push2his 海外不稳定故沉底）。新浪日K 经 quotes.sina.cn 直连，稳定(877ms)。
          #    - Tushare 已明确不纳入（主人 2026-09-02 拍板），日K序不含 tushare。
          TENCENT_PRIORITY: ${{ vars.TENCENT_PRIORITY || '2' }}
          BAOSTOCK_PRIORITY: ${{ vars.BAOSTOCK_PRIORITY || '0' }}
          AKSHARE_PRIORITY: ${{ vars.AKSHARE_PRIORITY || '10' }}
          EFINANCE_PRIORITY: ${{ vars.EFINANCE_PRIORITY || '99' }}
          TUSHARE_PRIORITY: ${{ vars.TUSHARE_PRIORITY || '50' }}
          YFINANCE_PRIORITY: ${{ vars.YFINANCE_PRIORITY || '50' }}
          PYTDX_PRIORITY: ${{ vars.PYTDX_PRIORITY || '50' }}
          FUTU_PRIORITY: ${{ vars.FUTU_PRIORITY || '50' }}
          LONGBRIDGE_PRIORITY: ${{ vars.LONGBRIDGE_PRIORITY || '50' }}
          DAILY_SOURCE: ${{ vars.DAILY_SOURCE || 'baostock,sina,tencent,akshare' }}
          # 快照链（screening/snapshot.py，不走 data_provider）：仅控制快照这一拍。
          # em_datacenter 打头为绕开 sina 快照 volume_ratio 解析坑（benchmark 测不出 schema 兼容，保留此序）。
          SNAPSHOT_SOURCE_PRIORITY: ${{ vars.SNAPSHOT_SOURCE_PRIORITY || 'em_datacenter,akshare_em,sina,efinance' }}
          # P1 单家锚定：把该源 pin 到 DataFetcherManager 日K 链路首位，配合
          # src/storage.py save_daily_data 的 canonical_source 护栏，避免 stock_daily 跨源拼接。
          # 选股快照链(snapshot.py)不写 stock_daily，但分析/回测/agent 路径写，故统一设 tencent（run#11/#12 实测 100/100）。
          DAILY_CANONICAL_SOURCE: ${{ vars.DAILY_CANONICAL_SOURCE || 'tencent' }}
          # Tushare Pro 自定义接入地址（可选；指向自建网关或第三方兼容镜像时设置）
          TUSHARE_HTTP_URL: ${{ vars.TUSHARE_HTTP_URL || secrets.TUSHARE_HTTP_URL }}
          # TickFlow（A 股日 K、实时行情、股票列表/名称与大盘复盘增强；不设则走免费源 fallback）
          TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          TICKFLOW_PRIORITY: ${{ vars.TICKFLOW_PRIORITY || secrets.TICKFLOW_PRIORITY }}
          TICKFLOW_KLINE_ADJUST: ${{ vars.TICKFLOW_KLINE_ADJUST || secrets.TICKFLOW_KLINE_ADJUST }}
          TICKFLOW_BATCH_DAILY_ENABLED: ${{ vars.TICKFLOW_BATCH_DAILY_ENABLED || secrets.TICKFLOW_BATCH_DAILY_ENABLED }}
          TICKFLOW_BATCH_SIZE: ${{ vars.TICKFLOW_BATCH_SIZE || secrets.TICKFLOW_BATCH_SIZE }}
          # Longbridge OpenAPI（美股/港股实时行情字段补充；不设则仅 YFinance/AkShare，无 [Longbridge] 调用）
          LONGBRIDGE_OAUTH_CLIENT_ID: ${{ vars.LONGBRIDGE_OAUTH_CLIENT_ID || secrets.LONGBRIDGE_OAUTH_CLIENT_ID }}
          LONGBRIDGE_OAUTH_TOKEN_CACHE_B64: ${{ secrets.LONGBRIDGE_OAUTH_TOKEN_CACHE_B64 }}
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_REGION: ${{ vars.LONGBRIDGE_REGION || secrets.LONGBRIDGE_REGION }}
          LONGBRIDGE_HTTP_URL: ${{ vars.LONGBRIDGE_HTTP_URL || secrets.LONGBRIDGE_HTTP_URL }}
          LONGBRIDGE_QUOTE_WS_URL: ${{ vars.LONGBRIDGE_QUOTE_WS_URL || secrets.LONGBRIDGE_QUOTE_WS_URL }}
          LONGBRIDGE_TRADE_WS_URL: ${{ vars.LONGBRIDGE_TRADE_WS_URL || secrets.LONGBRIDGE_TRADE_WS_URL }}
          LONGBRIDGE_STATIC_INFO_TTL_SECONDS: ${{ vars.LONGBRIDGE_STATIC_INFO_TTL_SECONDS || secrets.LONGBRIDGE_STATIC_INFO_TTL_SECONDS }}
          LONGBRIDGE_ENABLE_OVERNIGHT: ${{ vars.LONGBRIDGE_ENABLE_OVERNIGHT || secrets.LONGBRIDGE_ENABLE_OVERNIGHT }}
          LONGBRIDGE_PUSH_CANDLESTICK_MODE: ${{ vars.LONGBRIDGE_PUSH_CANDLESTICK_MODE || secrets.LONGBRIDGE_PUSH_CANDLESTICK_MODE }}
          LONGBRIDGE_PRINT_QUOTE_PACKAGES: ${{ vars.LONGBRIDGE_PRINT_QUOTE_PACKAGES || secrets.LONGBRIDGE_PRINT_QUOTE_PACKAGES }}

          # ==========================================
          # 搜索服务
          # ==========================================
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}
          ANSPIRE_LLM_MODEL: ${{ vars.ANSPIRE_LLM_MODEL || secrets.ANSPIRE_LLM_MODEL }}
          ANSPIRE_LLM_BASE_URL: ${{ vars.ANSPIRE_LLM_BASE_URL || secrets.ANSPIRE_LLM_BASE_URL }}
          ANSPIRE_LLM_ENABLED: ${{ vars.ANSPIRE_LLM_ENABLED || secrets.ANSPIRE_LLM_ENABLED }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS }}
          MINIMAX_API_KEYS: ${{ secrets.MINIMAX_API_KEYS }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS }}
          SEARXNG_BASE_URLS: ${{ vars.SEARXNG_BASE_URLS || secrets.SEARXNG_BASE_URLS }}
          SEARXNG_PUBLIC_INSTANCES_ENABLED: ${{ vars.SEARXNG_PUBLIC_INSTANCES_ENABLED || secrets.SEARXNG_PUBLIC_INSTANCES_ENABLED }}
          SEARXNG_TIMEOUT_SECONDS: ${{ vars.SEARXNG_TIMEOUT_SECONDS || secrets.SEARXNG_TIMEOUT_SECONDS }}

          # ==========================================
          # 运行配置
          # ==========================================
          # 选股引擎开关（默认 true；设 false 跳过选股）
          SCREENING_ENABLED: ${{ vars.SCREENING_ENABLED || secrets.SCREENING_ENABLED || 'true' }}
          TRADING_DAY_CHECK_ENABLED: ${{ vars.TRADING_DAY_CHECK_ENABLED || secrets.TRADING_DAY_CHECK_ENABLED || 'true' }}
          # 系统配置
          LOG_LEVEL: INFO
          MAX_WORKERS: ${{ vars.MAX_WORKERS || secrets.MAX_WORKERS || '1' }}

        run: |
          # 处理 LITELLM YAML 配置文件（选股逻辑解释同样走 LLM 渠道）
          if [ -n "$LITELLM_CONFIG_YAML" ] && [ -n "$LITELLM_CONFIG" ]; then
            echo "📝 使用 GitHub Actions Secrets/Variables 中的 LITELLM_CONFIG_YAML 配置"
            mkdir -p "$(dirname "$LITELLM_CONFIG")"
            echo "$LITELLM_CONFIG_YAML" > "$LITELLM_CONFIG"
            echo "✅ LITELLM 配置文件已写入: $LITELLM_CONFIG"
          fi

          # 解析选股参数（手动触发时用 dispatch inputs，cron 用默认值）
          SCREENING_STRATEGY="${{ github.event.inputs.screening_strategy || 'auto' }}"
          SCREENING_MARKET="${{ github.event.inputs.screening_market || 'cn' }}"
          SCREENING_MAX_RESULTS="${{ github.event.inputs.screening_max_results || '20' }}"
          SCREENING_SEED="${{ github.event.inputs.screening_seed || '' }}"

          echo "=========================================="
          echo "🔍 每日选股"
          echo "=========================================="
          echo "⏰ 时间: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')"
          echo "🎯 策略: $SCREENING_STRATEGY"
          echo "📊 市场: $SCREENING_MARKET"
          echo "🔢 上限: $SCREENING_MAX_RESULTS"
          echo "🌱 种子: ${SCREENING_SEED:-自动}"
          echo "🤖 主模型: ${LITELLM_MODEL:-未设置（回落 GEMINI_MODEL=${GEMINI_MODEL:-默认}）}"
          echo "🔗 备用链: ${LITELLM_FALLBACK_MODELS:-未设置}"
          echo ""

          python scripts/run_screening.py \
            --strategy "$SCREENING_STRATEGY" \
            --market "$SCREENING_MARKET" \
            --max-results "$SCREENING_MAX_RESULTS" \
            --seed "$SCREENING_SEED" \
            || echo "::warning::选股运行未成功，已跳过（不影响其他流程）"

      - name: 推送选股结果到飞书
        if: always()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          FEISHU_WEBHOOK_KEYWORD: ${{ vars.FEISHU_WEBHOOK_KEYWORD || secrets.FEISHU_WEBHOOK_KEYWORD }}
        run: |
          DATE=$(TZ='Asia/Shanghai' date '+%Y%m%d')
          export DATE
          if [ -z "$FEISHU_WEBHOOK_URL" ]; then
            echo "⚪ 未配置 FEISHU_WEBHOOK_URL，跳过飞书推送（配置方法见官方文档 docs/bot/feishu-bot-config.md）"
            exit 0
          fi
          if [ ! -f "reports/screening_${DATE}.md" ]; then
            echo "⚠️ 未生成 reports/screening_${DATE}.md，跳过飞书推送"
            exit 0
          fi
          python - <<'PY'
          import os, time, hmac, hashlib, base64, json, re, urllib.request, urllib.error
          
          date = os.environ["DATE"]
          url = os.environ.get("FEISHU_WEBHOOK_URL", "").strip()
          secret = os.environ.get("FEISHU_WEBHOOK_SECRET", "").strip()
          keyword = os.environ.get("FEISHU_WEBHOOK_KEYWORD", "").strip()
          
          # ---- 中文映射：与 scripts/run_screening.py 保持一致（改动需两侧同步）----
          _STRATEGY_CN = {
              "balanced_alpha": "均衡优选", "blue_chip_income": "蓝筹红利", "capital_heat": "资金热度",
              "dual_low": "双低稳健", "low_volatility_quality": "低波质量", "momentum_quality": "趋势质量",
              "oversold_reversal": "超跌反转", "quality_value": "质量价值", "shrink_pullback": "缩量回踩",
              "volume_breakout": "放量突破",
          }
          _MARKET_CN = {"cn": "A股", "hk": "港股", "us": "美股"}
          _STATE_CN = {"STRONG": "进攻", "MIX": "震荡", "BEAR": "防御"}
          _STATE_COLOR = {"STRONG": "green", "MIX": "orange", "BEAR": "red"}
          _RANKING_CN = {"llm": "AI 排序", "screen_score": "本地评分"}
          _SOURCE_CN = {
              "sina": "新浪", "tencent": "腾讯", "efinance": "东财(efinance)",
              "akshare_em": "东财(akshare)", "em_datacenter": "东财(datacenter)",
              "akshare": "AKShare", "baostock": "Baostock", "last_good_cache": "快照缓存",
          }
          _KLINE_SRC_CN = {"tencent": "腾讯", "efinance": "东财", "baostock": "Baostock",
                           "akshare": "AKShare", "sina": "新浪"}
          
          
          def _first(d: dict, *keys):
              for k in keys:
                  v = d.get(k)
                  if v not in (None, ""):
                      return v
              return ""
          
          
          def _short_kline_source(key: str) -> str:
              s = str(key).replace("dsa:", "").removesuffix("Fetcher").strip().lower()
              return _KLINE_SRC_CN.get(s, s)
          
          
          def _kline_brief(info: dict) -> str:
              if not info:
                  return "日K 未知"
              sources = info.get("sources") or {}
              attempted = int(info.get("attempted") or 0)
              succeeded = int(info.get("succeeded") or 0)
              if sources:
                  detail = " ".join(f"{_short_kline_source(k)}×{v}"
                                    for k, v in sorted(sources.items(), key=lambda kv: -kv[1]))
                  return f"日K：{detail}（{succeeded}/{attempted} 成功）"
              if not info.get("requested"):
                  return "日K：未拉取（策略无需）"
              return "日K：拉取失败"
          
          
          def _model_short(model) -> str:
              return str(model).split("/", 1)[-1]
          
          
          def _score_str(c: dict) -> str:
              for k in ("score", "merge_score", "llm_score"):
                  v = c.get(k)
                  if v not in (None, ""):
                      return str(v)
              return ""
          
          
          def _cand_line(c: dict) -> str:
              code = _first(c, "code", "symbol")
              name = _first(c, "name", "stock_name")
              reason = _first(c, "reason", "selection_logic", "comment")
              star = "★ " if len(c.get("source_strategies") or []) >= 2 else ""
              title = f"**{code} {name}**"
              sc = _score_str(c)
              if sc:
                  title += f"（{sc}分）"
              if reason:
                  reason = " ".join(str(reason).split()).strip()
                  if len(reason) > 100:
                      reason = reason[:100] + "…"
                  return f"{star}{title}：{reason}"
              return f"{star}{title}"
          
          
          def _build_card(d: dict) -> dict:
              cands = d.get("candidates") or []
              strategies = [s for s in (d.get("strategies_used") or []) if s]
              if strategies:
                  strategy_label = " × ".join(_STRATEGY_CN.get(s, s) for s in strategies)
                  rc = int(d.get("resonance_count") or 0)
                  resonance_note = f"（共振 ★{rc}）" if rc else ""
              else:
                  strategy_label = str(d.get("strategy") or "auto")
                  resonance_note = ""
              state = str(d.get("market_state") or "").strip().upper()
              state_cn = _STATE_CN.get(state)
              market = str(d.get("market") or "cn").lower()
          
              head = []
              if state:
                  head.append(f"**市场态**：{state} · {state_cn}" if state_cn else f"**市场态**：{state}")
              if market and market != "cn":
                  head.append(f"**市场**：{_MARKET_CN.get(market, market)}")
              head.append(f"**策略**：{strategy_label}")
              head.append(f"**入选**：{len(cands)} 只{resonance_note}")
          
              elements = [
                  {"tag": "div", "text": {"tag": "lark_md", "content": "\n".join(head)}},
                  {"tag": "hr"},
                  {"tag": "div", "text": {"tag": "lark_md", "content": "**入选标的**"}},
              ]
              for c in cands:
                  elements.append({"tag": "div", "text": {"tag": "lark_md", "content": _cand_line(c)}})
              risk = str(d.get("llm_portfolio_risk") or "").strip()
              if risk:
                  elements.append({"tag": "hr"})
                  elements.append({"tag": "div", "text": {"tag": "lark_md", "content": f"**风险提示**：{risk}"}})
              parts = []
              model = _model_short(d.get("llm_model_used") or "")
              if model:
                  parts.append(f"模型 {model}")
              src = str(d.get("snapshot_source") or "")
              parts.append(f"快照 {_SOURCE_CN.get(src, src or 'n/a')} {d.get('snapshot_count') or 0} 只")
              dk = (d.get("data_sources") or {}).get("daily_kline") or {}
              parts.append(_kline_brief(dk))
              rm = str(d.get("ranking_mode") or "")
              parts.append(f"排名 {_RANKING_CN.get(rm, rm)}")
              elements.append({"tag": "hr"})
              elements.append({"tag": "note", "elements": [{"tag": "lark_md", "content": " ｜ ".join(parts)}]})
              return {
                  "config": {"wide_screen_mode": True},
                  "header": {"template": _STATE_COLOR.get(state, "grey"),
                             "title": {"tag": "plain_text", "content": f"📊 每日选股 · {date}"}},
                  "elements": elements,
              }
          
          
          def _feishu_clean(text: str) -> str:
              out: list[str] = []
              for raw in text.splitlines():
                  s = raw.strip()
                  if not s:
                      if out and out[-1] != "":
                          out.append("")
                      continue
                  if s.startswith("### "):
                      s = s[4:]
                  elif s.startswith("## "):
                      s = s[3:]
                  elif s.startswith("# "):
                      continue
                  s = re.sub(r"^[-*]\s+", "", s)
                  s = s.replace("**", "").strip()
                  if s:
                      out.append(s)
              while out and out[-1] == "":
                  out.pop()
              return "\n".join(out)
          
          
          body = None
          # 主路径：读结构化 JSON 渲染 interactive 卡片（手机自适应，无 md 符号噪音）
          try:
              with open(f"reports/screening_{date}.json", encoding="utf-8") as fh:
                  data = json.load(fh)
              if isinstance(data, dict) and data.get("candidates") is not None:
                  body = {"msg_type": "interactive", "card": _build_card(data)}
              else:
                  raise ValueError("json 结构异常")
          except Exception as exc:
              print(f"::warning::卡片构造失败({exc})，降级 text 推送")
          
          # 降级路径：JSON 缺失/异常时回退 md 清洗文本
          if body is None:
              try:
                  with open(f"reports/screening_{date}.md", encoding="utf-8") as fh:
                      md_text = fh.read().strip()
                  cleaned = _feishu_clean(md_text)
                  if keyword and keyword not in cleaned:
                      cleaned = f"{keyword}\n{cleaned}"
                  body = {"msg_type": "text", "content": {"text": f"📊 每日选股 · {date}\n\n{cleaned}"}}
              except Exception as exc2:
                  print(f"::warning::text 降级也失败: {exc2}")
          
          if body is None:
              print("⚪ 无可推送内容，跳过")
              exit(0)
          
          # 卡片/富文本约 30KB 上限；超长时裁剪候选区，只留概要/头部与尾部注脚
          if len(json.dumps(body, ensure_ascii=False)) > 28000 and body.get("msg_type") == "interactive":
              els = body["card"]["elements"]
              body["card"]["elements"] = els[:3] + [
                  {"tag": "note", "elements": [{"tag": "lark_md", "content": "…（候选过多已裁剪，完整清单见 Actions 构建产物）"}]}
              ] + els[-2:]
              print("::warning::卡片超长，候选区已裁剪")
          
          if secret:
              timestamp = str(round(time.time()))
              string_to_sign = f"{timestamp}\n{secret}"
              sign = base64.b64encode(
                  hmac.new(string_to_sign.encode("utf-8"), digestmod=hashlib.sha256).digest()
              ).decode("utf-8")
              body["timestamp"] = timestamp
              body["sign"] = sign
          
          try:
              req = urllib.request.Request(
                  url,
                  data=json.dumps(body, ensure_ascii=False).encode("utf-8"),
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
              if result.get("code") == 0 or result.get("StatusCode") == 0:
                  print(f"✅ 飞书推送成功（{body['msg_type']}）")
              else:
                  print(f"::warning::飞书推送返回异常: {result}")
          except urllib.error.HTTPError as e:
              print(f"::warning::飞书推送 HTTP {e.code}: {e.read().decode('utf-8', 'ignore')[:300]}")
          except Exception as e:
              print(f"::warning::飞书推送失败: {e}")
          PY

      - name: 上传选股结果
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screening-reports-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30

      # 把每日信号归档到独立的 signals 分支。
      # Actions 本身无状态，runner 结束即销毁；不归档的话本地永远拿不到历史信号，
      # 也就无法做任何回测。用独立孤儿分支可避免污染 dev 的提交历史。
      - name: 归档信号到 signals 分支
        if: always()
        run: |
          DATE=$(TZ='Asia/Shanghai' date '+%Y%m%d')
          SRC="reports/screening_${DATE}.json"
          if [ ! -f "$SRC" ]; then
            echo "⚠️ 无信号文件 $SRC，跳过归档"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin signals 2>/dev/null || echo "signals 分支尚不存在，将创建"
          if git show-ref --verify --quiet refs/remotes/origin/signals; then
            git checkout -B signals origin/signals
          else
            git checkout --orphan signals
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          mkdir -p signals
          cp "$SRC" "signals/screening_${DATE}.json"
          git add "signals/screening_${DATE}.json"

          if git diff --cached --quiet; then
            echo "信号无变化，跳过提交"
          else
            # [skip ci] 避免归档提交反过来触发本 workflow
            git commit -m "chore(signals): archive screening ${DATE} [skip ci]"
            git push origin signals
            echo "✅ 信号已归档：signals/screening_${DATE}.json"
          fi

      - name: 显示选股结果
        if: always()
        run: |
          echo ""
          echo "=========================================="
          echo "🔍 选股完成"
          echo "=========================================="
          DATE=$(TZ='Asia/Shanghai' date '+%Y%m%d')
          if [ -f "reports/screening_${DATE}.md" ]; then
            echo "生成的选股报告:"
            cat "reports/screening_${DATE}.md"
          elif [ -d "reports" ] && [ "$(ls -A reports 2>/dev/null)" ]; then
            echo "reports/ 目录内容:"
            ls -la reports/
          else
            echo "⚠️ 未生成选股报告文件"
          fi
